name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository invariants
        run: python3 -m pip install -r requirements.txt -r requirements-collector.txt
      - name: Validate repository data
        run: python3 scripts/validate_repo.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Check browser filters and public data
        run: |
          node --test tests/test_*.mjs
          python3 scripts/validate_public_data.py
      - name: Check the distributable skill
        run: |
          python3 scripts/build_release.py --output /tmp/kc-skill-release
          python3 scripts/verify_release.py /tmp/kc-skill-release/kc-activity-finder-v$(cat VERSION).zip --smoke-test

