name: Publish versioned skill

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-collector.txt
      - name: Validate source and regression tests
        run: |
          python3 scripts/validate_repo.py
          python3 -m unittest discover -s tests -v
          node --test tests/test_*.mjs
          python3 scripts/validate_public_data.py
      - name: Build the exact tagged tree
        run: |
          python3 scripts/build_release.py --tag "$RELEASE_TAG"
          python3 scripts/verify_release.py "dist/kc-activity-finder-$RELEASE_TAG.zip" --smoke-test
          cd dist
          sha256sum --check SHA256SUMS
      - name: Test the public version-pinned installation
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          install_dir="$RUNNER_TEMP/kc-skill-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          git init -q
          npx --yes skills@1.7.6 add "https://github.com/$GH_REPO/tree/$RELEASE_TAG" \
            --skill kc-activity-finder --agent codex --copy --yes --json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('skills-lock.json').read_text())
          assert lock['skills']['kc-activity-finder']['ref'] == os.environ['RELEASE_TAG']
          installed = Path('.agents/skills/kc-activity-finder')
          source = Path(os.environ['GITHUB_WORKSPACE'])
          for name in ('SKILL.md', 'VERSION', 'data/source-graph.json', 'scripts/activity_pipeline.py', 'scripts/day_trip_planner.py'):
              assert (installed / name).read_bytes() == (source / name).read_bytes(), name
          print('Public installer pinned the expected tag and copied its runtime files')
          PY
          python3 .agents/skills/kc-activity-finder/scripts/validate_repo.py
      - name: Upload verified assets to a draft release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "KC Activity Finder $RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            "dist/kc-activity-finder-$RELEASE_TAG.zip" dist/SHA256SUMS
      - name: Verify downloaded assets and publish
        run: |
          verify_dir="$RUNNER_TEMP/kc-release-verification"
          mkdir -p "$verify_dir"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          cd "$verify_dir"
          sha256sum --check SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
