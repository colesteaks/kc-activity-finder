name: Collect activities and publish site
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh live sources before deploying
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/collect_activities.py'
      - 'scripts/refresh_sources.py'
      - 'scripts/validate_public_data.py'
      - 'scripts/activity_model.py'
      - 'scripts/place_model.py'
      - 'data/activity-taxonomy.json'
      - 'data/places.json'
      - 'schemas/activity.schema.json'
      - 'schemas/place.schema.json'
      - 'data/collection-sources.json'
      - 'requirements-collector.txt'
      - '.github/workflows/activities.yml'
      - 'tests/test_collector.py'
      - 'tests/test_filters.mjs'
      - 'tests/test_activity_model.py'
      - 'tests/test_place_model.py'
      - 'tests/test_places.mjs'
permissions:
  contents: read
concurrency:
  group: activities-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install parsers and tests
        run: python3 -m pip install -r requirements.txt -r requirements-collector.txt
      - name: Test
        run: |
          python3 scripts/validate_repo.py
          python3 -m unittest discover -s tests -v
          node --test tests/test_*.mjs
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .collector-cache
          key: activity-http-${{ runner.os }}-${{ github.run_id }}
          restore-keys: activity-http-${{ runner.os }}-
      - name: Discover sources and collect seven months ahead
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          python3 scripts/refresh_sources.py
          python3 scripts/collect_activities.py
          python3 scripts/refresh_sources.py --coverage-only
      - name: Validate public data
        run: python3 scripts/validate_public_data.py
      - name: Commit updated flat files
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/activities.json data/generated-source-graph.json data/source-proposals.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh activity inventory and source proposals [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
